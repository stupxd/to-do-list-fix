[manifest]
version = "1.0.0"
dump_lua = true
priority = -69

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
self.ability.to_do_poker_hand = pseudorandom_element(_poker_hands, pseudoseed((self.area and self.area.config.type == 'title') and 'false_to_do' or 'to_do'))'''
position = "at"
payload = '''
self.ability.to_do_poker_hand = pseudorandom_element(_poker_hands, pseudoseed(G.OVERLAY_MENU and 'false_to_do' or 'to_do'))'''
match_indent = true
